# Render Blueprint: Dashboard → New → Blueprint → velg dette repoet
services:
  - type: web
    name: karin-bursdag
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EVENT_TITLE
        value: Karins bursdag
      - key: ADMIN_PIN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
